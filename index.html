<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1 British Pounds</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f0;
      color: #111;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 10px;
      font-weight: normal;
    }

    p {
      font-size: 1rem;
      margin: 8px 0;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 24px;
      border: 1px solid #111;
      text-decoration: none;
      color: #111;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #111;
      color: #f5f5f0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>£0</h1>

    <p>towards £1,000,000</p>

    <p>for a house in London</p>

    <p style="margin-top:20px;">
      A web project by a London-based artist.
    </p>

    <a class="button" href="#">
      Give £1
    </a>

    <p style="margin-top:30px; font-size:0.9rem;">
      You will receive nothing.
    </p>
  </div>
</body>
</html>
