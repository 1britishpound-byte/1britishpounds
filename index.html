<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>1 British Pound</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f0;
      color: #111;
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 520px;
      padding: 14vh 20px 40px;
    }

    h1 {
      font-size: 5rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: -2px;
    }

    .collected {
      font-size: 0.95rem;
      margin-top: 6px;
      margin-bottom: 28px;
      color: #333;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 10px 0;
    }

    .button {
      display: inline-block;
      margin-top: 38px;
      padding: 18px 40px;
      border: 2px solid #000;
      background: #000;
      color: #f5f5f0;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 500;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #222;
      border-color: #222;
    }

    .footer {
      margin-top: 34px;
      font-size: 0.95rem;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 3.8rem;
      }

      p {
        font-size: 0.98rem;
      }

      .button {
        width: 100%;
        padding: 16px 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>£0</h1>

    <div class="collected">
      collected so far
    </div>

    <p>
      towards the purchase of a house in London.
    </p>

    <p>
      You may contribute exactly £1.
    </p>

    <p>
      You will receive nothing.
    </p>

    <a class="button" href="#">
      Contribute £1
    </a>

    <div class="footer">
      A web project by a London-based artist.
    </div>

  </div>

</body>
</html>
