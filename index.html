<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>1 British Pound</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f0;
      color: #111;
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 520px;
      padding: 14vh 20px 40px;
    }

    .count {
      font-size: 1.1rem;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 5rem;
      margin-bottom: 14px;
      font-weight: 600;
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 1.4rem;
      margin-bottom: 38px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 10px 0;
    }

    .button {
      display: inline-block;
      margin-top: 34px;
      padding: 12px 24px;
      border: 1px solid #111;
      text-decoration: none;
      color: #111;
      transition: 0.2s ease;
      font-size: 1rem;
    }

    .button:hover {
      background: #111;
      color: #f5f5f0;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 3.8rem;
      }

      .subtitle {
        font-size: 1.15rem;
      }

      p {
        font-size: 0.98rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="count">
      £0 collected so far
    </div>

    <h1>£0</h1>

    <div class="subtitle">
      towards the purchase of a house in London.
    </div>

    <p>
      You may contribute exactly £1.
    </p>

    <p>
      You will receive nothing.
    </p>

    <a class="button" href="#">
      Contribute £1
    </a>

    <p style="margin-top:34px;">
      A web project by a London-based artist.
    </p>

  </div>

</body>
</html>
