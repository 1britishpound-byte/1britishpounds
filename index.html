<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>1 British Pound</title>

  <style>
    body {
      margin: 0;
      background: #f4f4f0;
      color: #111;
      font-family: "Times New Roman", Times, serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding-top: 18vh;
      padding-left: 30px;
      padding-right: 30px;
    }

    h1 {
      font-size: 5rem;
      font-weight: bold;
      margin: 0;
      line-height: 1;
    }

    .subtitle {
      font-size: 1.5rem;
      margin-top: 20px;
      margin-bottom: 40px;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.6;
      margin: 10px 0;
      max-width: 500px;
    }

    .button {
      display: inline-block;
      margin-top: 45px;
      padding: 14px 28px;
      border: 1px solid #111;
      text-decoration: none;
      color: #111;
      font-size: 1rem;
      transition: 0.15s ease;
    }

    .button:hover {
      background: #111;
      color: #f4f4f0;
    }

    .small {
      margin-top: 45px;
      font-size: 0.95rem;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 3.5rem;
      }

      .subtitle {
        font-size: 1.2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>£0</h1>

    <div class="subtitle">
      towards £1,000,000
    </div>

    <p>
      for the purchase of a house in London
    </p>

    <p>
      Visitors may contribute exactly £1.
    </p>

    <p>
      No rewards, products, updates, or returns
      will be provided.
    </p>

    <p>
      A web project by a London-based artist.
    </p>

    <a class="button" href="#">
      Contribute £1
    </a>

  </div>

</body>
</html>
